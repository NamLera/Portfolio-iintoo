<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Registration Form</title>
  </head>
  <body>
    <form>
      <h1 class="title">Get iintoo it today</h1>
      <p>There is no charge or obligation upon registration.</p>
  
  <!-- Ряд для Email и Phone -->
  <div class="input-row">
    <div class="input-container">
      <input type="email" id="email" placeholder=" " required>
      <label for="email">Email</label>
    </div>

    <div class="input-container">
      <input type="tel" id="phone" placeholder=" ">
      <label for="phone">Phone</label>
    </div>
  </div>

  <h3 class="title">What type of investor are you?</h3>
  <p>Select the type of investor you are below</p>


    <div class="investor-option">
    <input type="radio" name="investor" id="ind">
    <label for="ind">Individual</label>
    
    <!-- Иконка информации -->
    <span class="info-icon">ⓘ</span>
    
    <!-- Скрытый блок с текстом -->
    <div class="hint-box">
        I am a natural person investing on my own behalf as a sole owner, joint tenant, or tenant in common.
    </div>
      </div>
    </form>
  </body>
</html>
