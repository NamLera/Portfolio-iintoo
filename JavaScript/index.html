<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>>Мой первый JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
    <form id="form">
        <div class="field">
            <label>Имя пользователя</label>
            <input type="text" id="username" placeholder="минимум 3 символа">
            <span class="error-message" id="username-err"></span>
        </div>

        <div class="field">
            <label>Email</label>
            <input type="email" id="email" placeholder="example@gmail.com">
            <span class="error-message" id="email-err"></span>
        </div>

        <div class="field">
            <label>Password</label>
            <input type="password" id="password" placeholder="минимум 6 символов">
            <span class="error-message" id="password-err"></span>
        </div>

        <div class="field">
            <label>Повторите пароль</label>
            <input type="password" id="confirm" placeholder="повторите пароль">
            <span class="error-message" id="confirm-err"></span>
        </div>

        <button type="submit">Зарегистрироваться</button>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
